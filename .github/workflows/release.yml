name: release

# Publication is a tag, not a laptop: provenance is an OIDC attestation that only
# a CI provider can issue, so the artefact users install is the one this workflow
# built. No npm token is stored anywhere. The local pre-push hooks run every check
# on the tagged commit before it reaches the remote; this workflow has no check
# job of its own, only the guards that keep a wrong artefact from publishing.
on:
  push:
    tags: ['v*']

# Least privilege: read-only by default; the publish job re-declares the
# id-token scope it needs for npm OIDC trusted publishing.
permissions:
  contents: read

# Runners have no user-level uv pin and must select a patched interpreter.
env:
  UV_PYTHON: "3.14.10"

jobs:
  publish:
    # npm requires a package to exist before trusted publishing can be
    # configured, so the first tag is bootstrapped by hand per RELEASE.md.
    if: github.ref_name != 'v0.1.0'
    runs-on: ubuntu-latest
    # This environment admits only `v*` tags, and the admin-only tag ruleset
    # limits who can push one, so the signed tag push is the release approval
    # and publication follows without a second human gate.
    # Rollback: add a required reviewer to the environment to restore one.
    environment: npm-release
    timeout-minutes: 15
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for a short-lived publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action reads packageManager from package.json, and pinning a
      # version here as well makes it refuse to run.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # Node 24 bundles npm >= 11.5.1, the minimum for trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          registry-url: 'https://registry.npmjs.org'
          # Explicit, so a tag build never restores a dependency cache: a
          # poisoned cache would reach the published artefact.
          package-manager-cache: false
      # RELEASE.md requires the tag and package.json version to match; stop a
      # mismatched publish before any dependency is installed.
      - name: Tag must match package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # devDependencies supply tsc for the prepack build that npm publish runs.
      # Publication lifecycles include the release checks and need managed Python.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        timeout-minutes: 5
        with:
          version: '2026.10.23'
          cache: false
          mise_toml: |
            [tools]
            uv = "0.13.6"
      - run: pnpm install --frozen-lockfile
      # The published artefact is built from this tree, so its registry
      # signatures are checked before npm publish packs it.
      - name: Dependency signatures
        run: npm audit signatures
      # --provenance keeps the attestation explicit and fails loudly if the
      # trusted-publisher match is misconfigured.
      - run: npm publish --provenance --access public
