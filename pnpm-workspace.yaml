packages: []
# The harness packages this plugin consumes are registry peers, so they and the
# peers of those peers must resolve here; without this every harness import in
# the tests would resolve to nothing.
autoInstallPeers: true
# Quarantine window for registry packages; the harness release line is younger
# than the window, so it is excluded and the lockfile pins what resolves.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # The bare name needs its own entry: 'dsh-*' requires a hyphen, so it never
  # matched the base package, and the base package is the one the rest of the
  # harness line declares its peers against.
  - '@deepseek-ai/dsh'
  - '@deepseek-ai/dsh-*'
  # The 0.1.7 line peers on cordis ~4.0.4 and resolves the publisher's own
  # cordis, schemastery, cosmokit, and libreoffice modules published the same day,
  # so those names are excluded alongside the harness line. Everything else still
  # waits out the window.
  - '@deepseek-ai/cordis'
  - '@deepseek-ai/cordis-*'
  - '@deepseek-ai/cosmokit'
  - '@deepseek-ai/schemastery'
  - '@deepseek-ai/libreoffice-kit*'
  # The 0.2.0 line's pi-ai provider resolves its own runtime published the same
  # day, so those names are excluded with it; everything else still waits out the
  # window.
  - '@earendil-works/pi-ai'
  - '@earendil-works/pi-telemetry'
allowBuilds:
  # Build steps the pinned toolchain needs: the profile test drives
  # @deepseek-ai/dsh, which loads a subprocess backend, a native pty, and FFI.
  # A dependency absent from this list stays blocked.
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
# Security floors for transitive dependencies the harness and toolchain pull in.
# Each entry only matches the vulnerable range, so a release that already ships
# the fix resolves untouched and the entry can be dropped then.
#   GHSA-6qxp-vccf-f47h  @modelcontextprotocol/sdk, @modelcontextprotocol/client
#   GHSA-6prh-2h8m-c8cw  @modelcontextprotocol/client
#   GHSA-ch52-4w7c-c8xp  http-cache-semantics
#   GHSA-wq5f-xc86-pv6w  sharp
#   source-map-js        event-loop denial of service, fixed in 1.2.2
#   GHSA-px8p-9vwx-vf98  fflate
#   GHSA-587h-7wmj-h5pm, GHSA-r825-w8mm-5pxw, GHSA-698v-4r3x-3vcv  vite
overrides:
  '@modelcontextprotocol/client@<2.3.0': ^2.3.1
  '@modelcontextprotocol/sdk@<1.31.0': ^1.31.0
  'http-cache-semantics@<4.2.1': ^4.2.1
  'sharp@<0.35.5': ^0.35.5
  'source-map-js@<1.2.2': ^1.2.2
  'fflate@>=0.8.0 <0.8.3': ^0.8.3
  'vite@>=8.3.0 <8.3.3': ^8.3.4
